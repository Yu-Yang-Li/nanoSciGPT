[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "nanoscigpt"
version = "0.1.0"
description = "CPU teaching framework for sequence, grid, graph, geometry, and continuous scientific data"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.0",
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
nanoscigpt-classroom = "nanoscigpt.classroom:main"
nanoscigpt-baseline = "nanoscigpt.baseline:main"
nanoscigpt-autoresearch = "autoresearch.experiment:main"
nanoscigpt-ai-scientist-v1 = "autoresearch.v1:main"
nanoscigpt-ai-scientist-v2 = "autoresearch.v2:main"
nanoscigpt-evidence-pack = "nanoscigpt.evidence_pack:main"
nanoscigpt-doctor = "nanoscigpt.doctor:main"
nanoscigpt-prepare-structured = "nanoscigpt.prepare_structured:main"

[tool.setuptools.packages.find]
include = ["nanoscigpt*", "autoresearch*"]
